name: Deploy to Azure Web App
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure (no stored secrets)
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  WEBAPP_NAME: ${{ vars.WEBAPP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in ACR
        run: az acr build -r "$ACR_NAME" -t "manweta:${{ github.sha }}" .
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/manweta:${{ github.sha }}
